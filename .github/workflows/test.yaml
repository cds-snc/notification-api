on:
  push:
name: Python tests
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            run-tests:
              - '**'
              - '!.github/workflows/!(test).yaml'

  formatter:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.changes), 'run-tests') }}
    runs-on: ubuntu-latest
    env:
      POETRY_VIRTUALENVS_IN_PROJECT: true
    steps:
    - name: Install libcurl
      run: sudo apt-get update && sudo apt-get install libssl-dev libcurl4-openssl-dev

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python 3.12
      id: setup-python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: '3.14'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: venv-cache
      with:
        path: .venv
        key: ${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-venv-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-venv-

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .ruff_cache
        key: ${{ runner.os }}-ruff-${{ hashFiles('pyproject.toml', 'poetry.lock') }}-${{ github.ref_name }}
        restore-keys: |
          ${{ runner.os }}-ruff-${{ hashFiles('pyproject.toml', 'poetry.lock') }}-

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .mypy_cache
        key: ${{ runner.os }}-mypy-${{ hashFiles('mypy.ini', 'setup.cfg', 'pyproject.toml', 'poetry.lock') }}-${{ github.ref_name }}
        restore-keys: |
          ${{ runner.os }}-mypy-${{ hashFiles('mypy.ini', 'setup.cfg', 'pyproject.toml', 'poetry.lock') }}-

    - name: Install poetry
      env:
        POETRY_VERSION: "1.7.1"
      run: pip install poetry==${POETRY_VERSION} poetry-plugin-sort && poetry --version

    - name: Check poetry.lock aligns with pyproject.toml
      run: poetry check --lock

    - name: Install requirements
      run: poetry install --with test --no-interaction --no-ansi

    - name: Ruff check
      run: poetry run ruff check .

    - name: Ruff import order check
      run: poetry run ruff check --select I .

    - name: Ruff format check
      run: poetry run ruff format --check .

    - name: Generate version file
      run: make generate-version-file

    - name: Type check
      run: poetry run mypy .

    - name: Make version file
      run: |
        printf '__commit_sha__ = "09cfe03100443fb9071bba88d5c8775ff54a9ebc"\n__time__ = "2022-07-25:15:11:05"\n' > version.py
        cp version.py "${{ github.workspace }}/app/"

    - name: Copy site-packages in workspace
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/env/" && cp -fR $(poetry env list | poetry env info -p)/lib/python3.12/site-packages "${{ github.workspace }}/env/"

    - name: Install development .env file
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        cp -f .env.example .env

    - name: Checks for new endpoints against AWS WAF rules
      uses: cds-snc/notification-utils/.github/actions/waffles@a27df2c71ab173d57c384e65bdeb2d10dd5196a8 # 53.2.34
      with:
        app-loc: '/github/workspace'
        app-libs: '/github/workspace/env/site-packages'
        flask-mod: 'application'
        flask-prop: 'application'
        base-url: 'https://api.staging.notification.cdssandbox.xyz'

    - name: Notify Slack channel if this job fails
      if: ${{ failure() && github.ref == 'refs/heads/main' }}
      run: |
        json='{"text":"Scheduled CI testing failed: <https://github.com/cds-snc/notification-api/actions/runs/'${{ github.run_id }}'|GitHub actions>"}'
        curl -X POST -H 'Content-type: application/json' --data "$json"  ${{ secrets.SLACK_WEBHOOK }}

  test-serial:
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.changes), 'run-tests') }}
    env:
      CYPRESS_USER_PW_SECRET: ${{ secrets.CYPRESS_USER_PW_SECRET }}
      POETRY_VIRTUALENVS_IN_PROJECT: true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_notification_api
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:6.2
        ports:
        - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Install libcurl
      run: sudo apt-get update && sudo apt-get install libssl-dev libcurl4-openssl-dev

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python 3.12
      id: setup-python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: '3.14'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: venv-cache
      with:
        path: .venv
        key: ${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-venv-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-venv-

    - name: Install poetry
      env:
        POETRY_VERSION: "1.7.1"
      run: pip install poetry==${POETRY_VERSION} poetry-plugin-sort && poetry --version

    - name: Install requirements
      if: steps.venv-cache.outputs.cache-hit != 'true'
      run: poetry install --with test --no-interaction --no-ansi

    - name: Generate version file
      run: make generate-version-file

    - name: Ensure pytest is available
      run: |
        if ! poetry run pytest --version >/dev/null 2>&1; then
          echo "pytest missing; repairing virtualenv dependencies"
          poetry install --with test --no-interaction --no-ansi
        fi

    - name: Run serial tests
      run: |
        poetry run pytest --disable-pytest-warnings --cov=app --cov-report=term-missing \
          tests/ --junitxml=test_results_serial.xml -v --maxfail=10 -m "serial"

    - name: Upload test results on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: pytest-logs-serial
        path: |
          pytest*.log
          test_results_serial.xml

    - name: Notify Slack channel if this job fails
      if: ${{ failure() && github.ref == 'refs/heads/main' }}
      run: |
        json='{"text":"Scheduled CI testing failed: <https://github.com/cds-snc/notification-api/actions/runs/'${{ github.run_id }}'|GitHub actions>"}'
        curl -X POST -H 'Content-type: application/json' --data "$json"  ${{ secrets.SLACK_WEBHOOK }}

  test-parallel:
    needs: [changes]
    if: ${{ contains(fromJSON(needs.changes.outputs.changes), 'run-tests') }}
    env:
      CYPRESS_USER_PW_SECRET: ${{ secrets.CYPRESS_USER_PW_SECRET }}
      POETRY_VIRTUALENVS_IN_PROJECT: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # dao has ~40 test files — runs alone to balance load
          - name: dao
            test-args: "tests/app/dao"
          # service + v2 together (~27 files)
          - name: service-v2
            test-args: "tests/app/service tests/app/v2"
          # clients + celery together (~26 files)
          - name: clients-celery
            test-args: "tests/app/clients tests/app/celery"
          # everything else (smaller dirs + top-level test files)
          - name: rest
            test-args: "tests --ignore=tests/app/dao --ignore=tests/app/service --ignore=tests/app/v2 --ignore=tests/app/clients --ignore=tests/app/celery"
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_notification_api
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:6.2
        ports:
        - 6380:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Install libcurl
      run: sudo apt-get update && sudo apt-get install libssl-dev libcurl4-openssl-dev

    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python 3.12
      id: setup-python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: '3.14'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: venv-cache
      with:
        path: .venv
        key: ${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-venv-${{ hashFiles('poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-venv-

    - name: Install poetry
      env:
        POETRY_VERSION: "1.7.1"
      run: pip install poetry==${POETRY_VERSION} poetry-plugin-sort && poetry --version

    - name: Install requirements
      if: steps.venv-cache.outputs.cache-hit != 'true'
      run: poetry install --with test --no-interaction --no-ansi

    - name: Generate version file
      run: make generate-version-file

    - name: Ensure pytest is available
      run: |
        if ! poetry run pytest --version >/dev/null 2>&1; then
          echo "pytest missing; repairing virtualenv dependencies"
          poetry install --with test --no-interaction --no-ansi
        fi

    - name: Run parallel tests (${{ matrix.name }})
      run: |
        poetry run pytest --disable-pytest-warnings --cov=app --cov-report=term-missing \
          --junitxml=test_results_${{ matrix.name }}.xml -v --maxfail=10 \
          -m "not serial" -n auto \
          ${{ matrix.test-args }}

    - name: Upload test results on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: pytest-logs-${{ matrix.name }}
        path: |
          pytest*.log
          test_results_${{ matrix.name }}.xml

  test:
    # Keep a stable required check name (`test`) for branch protection.
    needs: [changes, formatter, test-serial, test-parallel]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Validate upstream test jobs
      shell: bash
      env:
        FORMATTER_RESULT: ${{ needs.formatter.result }}
        SERIAL_RESULT: ${{ needs.test-serial.result }}
        PARALLEL_RESULT: ${{ needs.test-parallel.result }}
      run: |
        set -euo pipefail

        if [[ "$FORMATTER_RESULT" == "failure" || "$FORMATTER_RESULT" == "cancelled" ]]; then
          echo "Job 'formatter' finished with result: $FORMATTER_RESULT"
          exit 1
        fi

        if [[ "$SERIAL_RESULT" == "failure" || "$SERIAL_RESULT" == "cancelled" ]]; then
          echo "Job 'test-serial' finished with result: $SERIAL_RESULT"
          exit 1
        fi

        if [[ "$PARALLEL_RESULT" == "failure" || "$PARALLEL_RESULT" == "cancelled" ]]; then
          echo "Job 'test-parallel' finished with result: $PARALLEL_RESULT"
          exit 1
        fi

        echo "Required test gate passed."

    - name: Notify Slack channel if this job fails
      if: ${{ failure() && github.ref == 'refs/heads/main' }}
      run: |
        json='{"text":"Scheduled CI testing failed: <https://github.com/cds-snc/notification-api/actions/runs/'${{ github.run_id }}'|GitHub actions>"}'
        curl -X POST -H 'Content-type: application/json' --data "$json"  ${{ secrets.SLACK_WEBHOOK }}

