name: Renovate Agent

on:
  schedule:
    # Runs every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run – find eligible package but do NOT open a PR"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  renovate-agent:
    name: Run Renovate Agent
    runs-on: ubuntu-latest

    # PostgreSQL is required by the Python test suite
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_notification_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # -----------------------------------------------------------------------
      # 1. Generate a bot token (needed to create branches + PRs)
      # -----------------------------------------------------------------------
      - name: Obtain a Notify PR Bot GitHub App Installation Access Token
        run: |
          TOKEN="$(npx --yes obtain-github-app-installation-access-token@1.1.0 ci ${{ secrets.PR_BOT_GITHUB_TOKEN }})"
          echo "::add-mask::$TOKEN"
          echo "GITHUB_TOKEN=$TOKEN" >> $GITHUB_ENV

      # -----------------------------------------------------------------------
      # 2. Checkout + toolchain setup
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ env.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Install libcurl (required by some Python test dependencies)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Poetry
        env:
          POETRY_VERSION: "1.7.1"
        run: pip install poetry==${POETRY_VERSION} && poetry --version

      - name: Check poetry.lock aligns with pyproject.toml
        run: poetry check --lock

      - name: Install Python dependencies
        run: poetry install --with test

      # -----------------------------------------------------------------------
      # 3. Find an eligible package upgrade
      # -----------------------------------------------------------------------
      - name: Find eligible Renovate package
        id: find
        run: |
          poetry run python scripts/renovate_agent.py --find
          if [ -f renovate-agent-plan.json ]; then
            echo "package_found=true" >> "$GITHUB_OUTPUT"
            # Export plan fields for downstream steps
            pkg=$(python -c "import json; d=json.load(open('renovate-agent-plan.json')); print(d['package'])")
            branch=$(python -c "import json; d=json.load(open('renovate-agent-plan.json')); print(d['branch'])")
            source_pr=$(python -c "import json; d=json.load(open('renovate-agent-plan.json')); print(d['source_pr_number'])")
            echo "package=${pkg}" >> "$GITHUB_OUTPUT"
            echo "branch=${branch}" >> "$GITHUB_OUTPUT"
            echo "source_pr_number=${source_pr}" >> "$GITHUB_OUTPUT"
          else
            echo "package_found=false" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # 4. Apply the dependency update (edit pyproject.toml + regenerate lockfile)
      # -----------------------------------------------------------------------
      - name: Apply dependency update
        if: steps.find.outputs.package_found == 'true' && (github.event.inputs.dry_run || 'false') != 'true'
        run: poetry run python scripts/renovate_agent.py --apply

      # -----------------------------------------------------------------------
      # 5. Commit the changes to a new branch and push
      # -----------------------------------------------------------------------
      - name: Create branch and commit changes
        if: steps.find.outputs.package_found == 'true' && (github.event.inputs.dry_run || 'false') != 'true'
        id: git-push
        env:
          BRANCH: ${{ steps.find.outputs.branch }}
          PACKAGE: ${{ steps.find.outputs.package }}
        run: |
          git config user.email "notify-pr-bot[bot]@users.noreply.github.com"
          git config user.name "notify-pr-bot[bot]"
          git checkout -b "$BRANCH"
          # Stage all changed dependency files
          git add pyproject.toml poetry.lock tests_cypress/package.json tests_cypress/package-lock.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit – package may already be at target version."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(deps): update ${PACKAGE} [renovate-agent]"
          git push origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 6. Run the full Python test suite on the updated branch
      # -----------------------------------------------------------------------
      - name: Run tests
        if: >-
          steps.find.outputs.package_found == 'true' &&
          inputs.dry_run != 'true' &&
          steps.git-push.outputs.pushed == 'true'
        run: poetry run make test

      - name: Upload pytest logs on failure
        if: >-
          failure() &&
          steps.find.outputs.package_found == 'true' &&
          inputs.dry_run != 'true' &&
          steps.git-push.outputs.pushed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-logs
          path: |
            pytest*.log
            test_results*.xml

      # -----------------------------------------------------------------------
      # 7. Open the PR (only when tests pass)
      # -----------------------------------------------------------------------
      - name: Create pull request
        if: >-
          steps.find.outputs.package_found == 'true' &&
          inputs.dry_run != 'true' &&
          steps.git-push.outputs.pushed == 'true' &&
          success()
        run: poetry run python scripts/renovate_agent.py --create-pr

      # -----------------------------------------------------------------------
      # 8. Clean up the remote branch when tests fail
      # -----------------------------------------------------------------------
      - name: Delete branch on test failure
        if: >-
          steps.find.outputs.package_found == 'true' &&
          inputs.dry_run != 'true' &&
          steps.git-push.outputs.pushed == 'true' &&
          failure()
        run: poetry run python scripts/renovate_agent.py --cleanup

      - name: Comment on source Renovate PR about test failure
        if: >-
          steps.find.outputs.package_found == 'true' &&
          inputs.dry_run != 'true' &&
          steps.git-push.outputs.pushed == 'true' &&
          failure()
        run: |
          poetry run python scripts/renovate_agent.py --comment-failure \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
